[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mainichi"
version = "1.0.0"
description = "A desktop post-it that teaches you a kanji a day"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "pcardaba" }]
keywords = ["japanese", "kanji", "jlpt", "flashcards", "desktop"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = []  # standard library only (tkinter)

[project.scripts]
mainichi = "mainichi.cli:main"

[project.urls]
Homepage = "https://github.com/pcardaba/mainichi"

[tool.setuptools.package-data]
mainichi = ["data/*.json.gz"]

[tool.setuptools.packages.find]
include = ["mainichi*"]
